<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relojería CRONOS — Asesor Virtual Inteligente (CRONOAI)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* Ajustes específicos para el contenedor del Asesor IA */
    .chat-page-main {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      background: radial-gradient(circle at top, rgba(20, 83, 45, 0.08), transparent 50%), #fafafc;
    }

    .chat-card {
      width: 100%;
      max-width: 680px;
      height: 720px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid #e2e8e5;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 45px rgba(15, 57, 35, 0.08);
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 24px;
      border-bottom: 1px solid #e8ece9;
      background: #fbfdfc;
    }

    .chat-avatar-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #14532d;
      color: #c5a059;
      border: 1.5px solid #c5a059;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .chat-header-text strong {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 16px;
      font-weight: 700;
      color: #091a13;
      letter-spacing: 0.05em;
    }

    .chat-header-text span {
      font-size: 12px;
      color: #16a34a;
      font-weight: 600;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #fafcfb;
    }

    .msg {
      max-width: 82%;
      padding: 13px 18px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.55;
    }

    .msg-bot {
      align-self: flex-start;
      background: #ffffff;
      color: #111116;
      border: 1px solid #e2e8e5;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .msg-user {
      align-self: flex-end;
      background: #14532d;
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(20, 83, 45, 0.2);
    }

    .msg-typing {
      color: #64748b;
      font-style: italic;
    }

    /* Opciones del cuestionario de 6 preguntas */
    .chat-options {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      align-self: flex-start;
      max-width: 95%;
      margin-top: 2px;
    }

    .chat-option-btn {
      padding: 9px 18px;
      border: 1.5px solid #14532d;
      color: #14532d;
      background: #ffffff;
      border-radius: 25px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 2px 6px rgba(20, 83, 45, 0.06);
    }

    .chat-option-btn:hover:not(:disabled) {
      background: #14532d;
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(20, 83, 45, 0.25);
    }

    .chat-option-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .chat-options-elegido .chat-option-btn:not(:disabled) {
      display: none;
    }

    /* Tarjetas de relojes recomendados (al terminar la pregunta 6) */
    .chat-resultados {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .chat-resultado-card {
      display: flex;
      gap: 16px;
      border: 1px solid #e2e8e5;
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
    }

    .chat-resultado-media {
      width: 100px;
      height: 100px;
      flex-shrink: 0;
      background: #fbfdfc;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid #edf2ee;
    }

    .chat-resultado-media img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    .chat-resultado-info {
      flex: 1;
      min-width: 0;
    }

    .chat-resultado-match {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #14532d;
      background: rgba(20, 83, 45, 0.08);
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 6px;
    }

    .chat-resultado-info h4 {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      margin-bottom: 4px;
      color: #091a13;
    }

    .chat-resultado-precio {
      font-size: 16px;
      font-weight: 700;
      color: #14532d;
      margin-bottom: 12px;
    }

    .chat-resultado-acciones {
      display: flex;
      gap: 10px;
    }

    /* Entrada de texto para seguir conversando tras las 6 preguntas */
    .chat-input {
      display: flex;
      gap: 12px;
      padding: 16px 22px;
      border-top: 1px solid #e8ece9;
      background: #ffffff;
    }

    .chat-input input {
      flex: 1;
      padding: 12px 20px;
      border: 1px solid #e2e8e5;
      border-radius: 30px;
      font-size: 14px;
      outline: none;
      background: #fbfdfc;
      color: #111116;
      font-family: inherit;
    }

    .chat-input input:focus {
      border-color: #14532d;
    }

    .chat-send {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #14532d;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s ease;
    }

    .chat-send:hover:not(:disabled) {
      background: #166534;
      transform: scale(1.05);
    }

    .chat-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    @media (max-width: 680px) {
      .chat-page-main {
        padding: 0;
      }
      .chat-card {
        height: calc(100vh - var(--nav-height));
        max-width: 100%;
        border-radius: 0;
        border: none;
      }
      .chat-resultado-card {
        flex-direction: column;
      }
      .chat-resultado-media {
        width: 100%;
        height: 150px;
      }
    }
  </style>
</head>
<body>

  <!-- ===================== NAVBAR UNIFICADA ===================== -->
  <header class="navbar">
    <div class="container nav-container-flex">
      <a href="index.html" class="brand">
        <img src="img/logo-cronos.png" alt="CRONOS" class="brand-logo-img">
      </a>

      <nav class="nav-links">
        <a href="index.html">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="index.html#nosotros">Nosotros</a>
        <a href="index.html#contacto">Contacto</a>
      </nav>

      <div class="nav-actions">
        <div id="auth-slot">
          <a href="login.html" class="btn-auth-link">Ingresar</a>
        </div>
        <button class="nav-toggle" aria-label="Abrir menú">☰</button>
      </div>
    </div>
  </header>

  <!-- ===================== INTERFAZ DEL ASESOR IA (CRONOAI) ===================== -->
  <main class="chat-page-main">
    <div class="chat-card">

      <div class="chat-header">
        <div class="chat-avatar-icon">
          ✨
        </div>
        <div class="chat-header-text">
          <strong>CRONOAI</strong>
          <span>● En línea</span>
        </div>
      </div>

      <!-- Contenedor donde chat-ia.js genera las 6 preguntas guiadas y las recomendaciones -->
      <div class="chat-messages" id="chat-messages"></div>

      <!-- Formulario para seguir la conversación libremente con Gemini tras las 6 preguntas -->
      <form class="chat-input" id="chat-form">
        <input type="text" placeholder="Respondé las preguntas de arriba..." disabled>
        <button type="submit" class="chat-send" disabled title="Enviar mensaje">➤</button>
      </form>

    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/whatsapp-config.js"></script>
  <script src="js/productos.js"></script>
  <script src="js/chat-ia.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
