<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel CRONOS — Ingresar</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="admin/css/dashboard.css">
</head>
<body>

  <div class="auth-wrap">
    <div class="auth-card">
      <span class="brand-crown">👑</span>
      <span class="eyebrow">PANEL DE ADMINISTRACIÓN</span>
      <h1>CRONOS</h1>
      <p class="auth-sub">Acceso exclusivo para el equipo de la relojería.</p>

      <!-- Mensaje de error para credenciales incorrectas -->
      <div id="auth-error" class="auth-error"></div>

      <form id="admin-login-form">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" required placeholder="admin@cronos.com" autocomplete="email">
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
        </div>

        <button type="submit" id="btn-submit-login">Ingresar al panel</button>
      </form>

      <div class="auth-switch">
        <a href="../index.html">← Volver al sitio público</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="js/admin-auth.js"></script>
</body>
</html>
